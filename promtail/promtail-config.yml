server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=pos-system"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - target_label: 'moi_truong'
        replacement: 'pos'

    pipeline_stages:
      - match:
          selector: '{service="nginx"}'
          stages:
            - regex:
                expression: '^(?P<ip>\S+) - \[(?P<ts>[^\]]+)\] "(?P<method>[A-Z]+) (?P<path>\S+) [^"]*" (?P<status>\d{3}) '
            - labels:
                method:
                status:
      - regex:
          expression: '(?i)(?P<muc>error|warn|fatal|critical|failed)'
      - template:
          source: muc
          template: '{{ ToLower .Value }}'
      - labels:
          muc:
